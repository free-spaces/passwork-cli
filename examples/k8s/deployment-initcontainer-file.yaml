apiVersion: v1
kind: ConfigMap
metadata:
  name: passwork-init-scripts
  namespace: default
data:
  fetch-secret.sh: |
    #!/bin/sh
    set -eu
    SECRET_VALUE="$(passwork-cli get --password-id "<item-id>" --field password)"
    printf "%s" "$SECRET_VALUE" > /work/secrets/app-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-init-file
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp-init-file
  template:
    metadata:
      labels:
        app: myapp-init-file
    spec:
      volumes:
        - name: secret-mem
          emptyDir:
            medium: Memory
        - name: init-scripts
          configMap:
            name: passwork-init-scripts
            defaultMode: 0755
      initContainers:
        - name: fetch-passwork-secret
          image: your-registry/your-app-with-passwork-cli:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: passwork-default-env
          command: ["/bin/sh", "/scripts/fetch-secret.sh"]
          volumeMounts:
            - name: secret-mem
              mountPath: /work/secrets
            - name: init-scripts
              mountPath: /scripts
      containers:
        - name: app
          image: your-registry/your-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_PASSWORD_FILE
              value: /run/secrets/app-password
          volumeMounts:
            - name: secret-mem
              mountPath: /run/secrets
              readOnly: true
          ports:
            - containerPort: 8080
